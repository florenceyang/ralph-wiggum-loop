{% extends "base.html" %}

{% block title %}Habits{% endblock %}

{% block content %}
<main class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-6 text-gray-800">Habit Tracker</h1>

    <section aria-labelledby="habits-heading" class="mb-6">
        <h2 id="habits-heading" class="sr-only">Habits</h2>

        <!-- Minimal client app: lists habits, add, and delete (uses backend API) -->
        <div id="habit-app" class="w-full bg-white rounded shadow p-4">
            <form id="new-habit-form" aria-label="Create habit" class="mb-4 flex gap-2 items-end">
                <div>
                    <label for="name" class="block text-sm text-gray-700">Name</label>
                    <input id="name" name="name" required maxlength="255" class="border rounded p-1" />
                </div>
                <div>
                    <label for="icon" class="block text-sm text-gray-700">Icon</label>
                    <select id="icon" name="icon" class="border rounded p-1" aria-label="Icon">
                        <option value="circle">Circle</option>
                        <option value="heart">Heart</option>
                        <option value="diamond">Diamond</option>
                        <option value="square">Square</option>
                        <option value="star">Star</option>
                        <option value="triangle">Triangle</option>
                    </select>
                </div>
                <div>
                    <label for="color" class="block text-sm text-gray-700">Color</label>
                    <input id="color" name="color" type="color" value="#1f77b4" aria-label="Color" />
                </div>
                <button type="submit" class="ml-2 bg-blue-600 text-white rounded px-3 py-1">Add</button>
            </form>

            <div aria-live="polite" id="status" class="text-sm text-gray-600 mb-2"></div>

            <ul id="habits-list" class="space-y-2" role="list" aria-label="Habit list"></ul>
        </div>
    </section>

    <p class="mt-6 text-gray-500 text-sm">This minimal view provides a simple habit CRUD UI using the existing backend API. Full frontend components (table, calendar) are planned per IMPLEMENTATION_PLAN.md.</p>
</main>

<script>
// Minimal client-side JS to interact with backend API
const iconGlyph = {
  circle: '●',
  heart: '♥',
  diamond: '◇',
  square: '■',
  star: '★',
  triangle: '▲',
};

async function fetchHabits() {
  const res = await fetch('/api/habits');
  if (!res.ok) throw new Error('Failed to fetch habits');
  return res.json();
}

function renderHabitItem(h) {
  const li = document.createElement('li');
  li.className = 'flex items-center justify-between border rounded p-2';
  li.setAttribute('role', 'listitem');
  li.innerHTML = `
    <div class="flex items-center gap-3">
      <span aria-hidden="true" style="color: ${h.color}; font-size: 20px;">${iconGlyph[h.icon] || '●'}</span>
      <span class="font-medium">${h.name}</span>
      <small class="text-gray-500 ml-2">${h.icon} ${h.color}</small>
    </div>
    <div>
    <button data-id="${h.id}" class="toggle-btn bg-green-500 text-white rounded px-2 py-1 mr-2">Today</button>
    <button data-id="${h.id}" class="delete-btn bg-red-500 text-white rounded px-2 py-1">Delete</button>
    </div>
  `;
  return li;
}

async function loadHabits() {
  const list = document.getElementById('habits-list');
  list.innerHTML = '';
  document.getElementById('status').textContent = 'Loading habits...';
  try {
    const habits = await fetchHabits();
    if (habits.length === 0) document.getElementById('status').textContent = 'No habits yet.';
    else document.getElementById('status').textContent = '';
    for (const h of habits) {
      const li = renderHabitItem(h);
      list.appendChild(li);
    }
  } catch (err) {
    document.getElementById('status').textContent = 'Error loading habits.';
    console.error(err);
  }
}

async function createHabit(data) {
  const res = await fetch('/api/habits', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data),
  });
  return res;
}

async function deleteHabit(id) {
  const res = await fetch(`/api/habits/${id}`, {method: 'DELETE'});
  return res;
}

document.addEventListener('DOMContentLoaded', () => {
  loadHabits();

  document.getElementById('new-habit-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const name = document.getElementById('name').value.trim();
    const icon = document.getElementById('icon').value;
    const color = document.getElementById('color').value;
    if (!name) return;
    document.getElementById('status').textContent = 'Creating habit...';
    try {
      const res = await createHabit({name, icon, color});
      if (res.status === 201) {
        document.getElementById('status').textContent = 'Habit created.';
        document.getElementById('new-habit-form').reset();
        // reset color to default
        document.getElementById('color').value = '#1f77b4';
        loadHabits();
      } else {
        const err = await res.json();
        document.getElementById('status').textContent = err.error || 'Failed to create habit';
      }
    } catch (e) {
      document.getElementById('status').textContent = 'Failed to create habit';
      console.error(e);
    }
  });

  document.getElementById('habits-list').addEventListener('click', async (ev) => {
    const toggleBtn = ev.target.closest('.toggle-btn');
    if (toggleBtn) {
      const id = toggleBtn.getAttribute('data-id');
      document.getElementById('status').textContent = 'Marking today...';
      try {
        const today = new Date().toISOString().slice(0,10); // YYYY-MM-DD
        const res = await fetch('/api/entries', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({habit_id: id, date: today, done: true}),
        });
        if (res.ok) {
          document.getElementById('status').textContent = 'Marked today.';
        } else {
          const err = await res.json();
          document.getElementById('status').textContent = err.error || 'Failed to mark today';
        }
      } catch (e) {
        document.getElementById('status').textContent = 'Failed to mark today';
        console.error(e);
      }
      return;
    }

    const btn = ev.target.closest('.delete-btn');
    if (!btn) return;
    const id = btn.getAttribute('data-id');
    if (!confirm('Delete this habit? This will remove associated entries.')) return;
    try {
      const res = await deleteHabit(id);
      if (res.ok) {
        document.getElementById('status').textContent = 'Habit deleted.';
        loadHabits();
      } else {
        const err = await res.json();
        document.getElementById('status').textContent = err.error || 'Failed to delete habit';
      }
    } catch (e) {
      document.getElementById('status').textContent = 'Failed to delete habit';
      console.error(e);
    }
  });
});
</script>

{% endblock %}
